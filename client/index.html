    <!-- Structured Data - SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Color Palette Tester",
      "description": "Compare all color pairings at once with numeric contrast scores and a selectable 3:1, 4.5:1, or 7:1 benchmark. Export your palette and chosen pairings.",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web",
      "url": "https://www.colorpalettetester.com/",
      "author": {
        "@type": "Organization",
        "name": "The Color Palette Studio",
        "url": "https://thecolorpalettestudio.com"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    
    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {"@type":"Question","name":"Can I choose a contrast benchmark?","acceptedAnswer":{"@type":"Answer","text":"Yes—choose 3:1, 4.5:1, or 7:1. Every pairing shows its contrast score and whether it meets your selected benchmark."}},
        {"@type":"Question","name":"How many colors can I test?","acceptedAnswer":{"@type":"Answer","text":"Typically 5–10 works best, but you can add more depending on device performance."}},
        {"@type":"Question","name":"Can I export pairings?","acceptedAnswer":{"@type":"Answer","text":"Yes—open Download, choose colors only or colors and pairings, then save a PNG or copy HEX codes or Studio Code."}},
        {"@type":"Question","name":"Is my data stored?","acceptedAnswer":{"@type":"Answer","text":"No. The tool runs client-side; palettes aren't saved unless you export."}},
        {"@type":"Question","name":"Is it free for commercial use?","acceptedAnswer":{"@type":"Answer","text":"Yes—this tester is free to use on personal or client projects."}}
      ]
    }
    </script>
    
    <!-- Structured Data - HowTo -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HowTo",
      "name": "How to Test Color Palette Accessibility",
      "description": "Step-by-step guide to compare the contrast scores of all color combinations in your brand palette",
      "step": [
        {
          "@type": "HowToStep",
          "position": 1,
          "name": "Add Your Brand Colors",
          "text": "Paste your brand colors as HEX, RGB, or HSL values separated by spaces, line breaks, or commas. For example: #FF6B35 #000000 #FFFFFF, rgb(255, 107, 53), or hsl(14, 100%, 61%).",
          "itemListElement": {
            "@type": "HowToDirection",
            "text": "Enter colors in any format: HEX (#RRGGBB), RGB (rgb(r,g,b)), or HSL (hsl(h,s%,l%))"
          }
        },
        {
          "@type": "HowToStep",
          "position": 2,
          "name": "Choose Your Contrast Benchmark",
          "text": "Choose a contrast benchmark of 3:1, 4.5:1, or 7:1. The default is 4.5:1. Higher benchmarks require more contrast between text and background.",
          "itemListElement": {
            "@type": "HowToDirection",
            "text": "Change the numeric benchmark to compare your palette against a different contrast target."
          }
        },
        {
          "@type": "HowToStep",
          "position": 3,
          "name": "Test All Color Combinations",
          "text": "Click the 'Test Contrast' button. The tool instantly calculates contrast ratios for every possible foreground/background pairing from your palette and displays pass/fail results.",
          "itemListElement": {
            "@type": "HowToDirection",
            "text": "The tool automatically tests every color combination at once, saving you hours of manual testing"
          }
        },
        {
          "@type": "HowToStep",
          "position": 4,
          "name": "Review and Export Results",
          "text": "Select your favorite combinations and open Download. Choose colors only or colors and pairings, then save a PNG or copy HEX codes or Studio Code. Use Passing only to see pairs that meet your selected numeric contrast benchmark.",
          "itemListElement": {
            "@type": "HowToDirection",
            "text": "Export selected pairs to share with your design team or include in brand style guides"
          }
        }
      ],
      "totalTime": "PT2M",
      "tool": {
        "@type": "HowToTool",
        "name": "Color Palette Tester"
      }
    }
    </script>
